<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyPet - 데스크톱 귀여운 데스크톱 펫</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0b0b;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      text-align: center;
      max-width: 680px;
      padding: 40px 20px;
    }
    .pet-preview {
      width: 110px;
      height: 110px;
      margin: 0 auto 24px;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .pet-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }
    p.subtitle {
      font-size: 18px;
      color: #999;
      margin-bottom: 40px;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .download-btn {
      background-color: #fff;
      color: #0b0b0b;
      border: none;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(255,255,255,0.1);
    }
    .download-btn:hover {
      transform: translateY(-2px);
      background-color: #e4e4e4;
      box-shadow: 0 6px 20px rgba(255,255,255,0.2);
    }
    .download-btn.secondary {
      background-color: #1a1a1a;
      color: #fff;
      border: 2px solid #333;
    }
    .download-btn.secondary:hover {
      background-color: #2a2a2a;
      border-color: #555;
    }
    .sub-links {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
    }
    .sub-links a {
      color: #aaa;
      text-decoration: underline;
      margin: 0 6px;
    }
    .sub-links a:hover {
      color: #fff;
    }
    .symbol {
      font-size: 20px;
    }
    .version-info {
      font-size: 13px;
      color: #666;
      border-top: 1px solid #1a1a1a;
      padding-top: 24px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="pet-preview">
      <img src="assets/icon.png" alt="MyPet Icon">
    </div>
    <h1>MyPet</h1>
    <p class="subtitle">바쁜 화면 위에서 나만의 펫과 함께하세요.<br>가볍고 직관적인 데스크톱 오버레이 펫 프로그램</p>

    <!-- 메인 다운로드 버튼 (사용자 OS에 맞춰 자동 변경됨) -->
    <div class="btn-group">
      <a id="mainDownloadBtn" href="#" class="download-btn">
        <span class="symbol"></span> 다운로드
      </a>
      <a id="winDownloadBtn" href="#" class="download-btn secondary">
        <span class="symbol">⊞</span> Windows 다운로드
      </a>
    </div>

    <!-- 인텔/실리콘 맥 수동 선택 링크 -->
    <div class="sub-links" id="macSubLinks" style="display: none;">
      맥 기종 변경: 
      <a id="macArmLink" href="#">Apple Silicon (M1/M2/M3)</a> | 
      <a id="macIntelLink" href="#">Intel</a>
    </div>

    <div class="version-info" id="versionText">
      최신 버전을 불러오는 중...
    </div>
  </div>

  <script>
    const GITHUB_REPO = "2thancho2/MyPet";

    // 자바스크립트로 현재 사용자의 기기가 Apple Silicon인지 확인
    function isAppleSilicon() {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (gl) {
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        if (debugInfo) {
          const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
          if (renderer && renderer.includes('Apple')) return true;
        }
      }
      // navigator 플랫폼 fallback (Mac 인지 확인)
      return navigator.platform && navigator.platform.indexOf('Mac') >= 0 && !navigator.userAgent.includes('Intel');
    }

    async function initDownloadPage() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases/latest`);
        if (!res.ok) throw new Error('릴리스 정보를 찾을 수 없습니다.');
        const data = await res.json();

        let arm64Url = '#';
        let x64MacUrl = '#';
        let winUrl = '#';

        // 릴리스에 올라온 파일들을 분석하여 실리콘맥, 인텔맥, 윈도우 파일 정확히 분류
        data.assets.forEach(asset => {
          const name = asset.name.toLowerCase();
          if (name.endsWith('.dmg')) {
            if (name.includes('arm64') || name.includes('aarch64') || name.includes('apple')) {
              arm64Url = asset.browser_download_url;
            } else if (name.includes('x64') || name.includes('intel') || name.includes('ia32')) {
              x64MacUrl = asset.browser_download_url;
            } else {
              // 구분자가 명확하지 않으면 기본적으로 arm64에 우선 할당
              if (arm64Url === '#') arm64Url = asset.browser_download_url;
            }
          } else if (name.endsWith('.exe')) {
            winUrl = asset.browser_download_url;
          }
        });

        // 만약 파일 하나만 올라와 있다면 양쪽 맥 링크에 동일하게 매칭
        if (arm64Url !== '#' && x64MacUrl === '#') x64MacUrl = arm64Url;
        if (x64MacUrl !== '#' && arm64Url === '#') arm64Url = x64MacUrl;

        const mainBtn = document.getElementById('mainDownloadBtn');
        const winBtn = document.getElementById('winDownloadBtn');
        const macSubLinks = document.getElementById('macSubLinks');

        // 접속한 OS에 따라 메인 버튼 다이내믹 변경
        const userAgent = navigator.userAgent.toLowerCase();
        const isWindows = userAgent.includes('win');

        if (isWindows) {
          mainBtn.href = winUrl !== '#' ? winUrl : '#';
          mainBtn.innerHTML = '<span class="symbol">⊞</span> Windows 다운로드';
          winBtn.style.display = 'none'; // 윈도우 유저에겐 윈도우 버튼을 메인으로
        } else {
          // 맥 유저인 경우 실리콘/인텔 자동 판별
          const silicon = isAppleSilicon();
          mainBtn.href = silicon ? arm64Url : x64MacUrl;
          mainBtn.innerHTML = silicon ? '<span class="symbol"></span> macOS 다운로드 (Apple Silicon)' : '<span class="symbol"></span> macOS 다운로드 (Intel)';
          
          // 서브 링크 표시해서 사용자가 직접 바꿀 수 있게 제공
          macSubLinks.style.display = 'block';
          document.getElementById('macArmLink').href = arm64Url;
          document.getElementById('macIntelLink').href = x64MacUrl;

          if (winUrl !== '#') winBtn.href = winUrl;
        }

        document.getElementById('versionText').textContent = `최신 버전: ${data.tag_name} 연동 완료`;
      } catch (err) {
        document.getElementById('versionText').textContent = 'GitHub 릴리스 정보를 불러오는 데 실패했습니다.';
      }
    }

    initDownloadPage();
  </script>
</body>
</html>
